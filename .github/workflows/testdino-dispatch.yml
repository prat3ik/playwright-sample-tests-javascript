# testdino-dispatch-version: 1
# Generated by TestDino. Merge as .github/workflows/testdino-dispatch.yml — do not rename.
name: TestDino Dispatch

on:
  workflow_dispatch:
    inputs:
      test_list:
        description: 'Newline-separated Playwright test locations (file or file:line)'
        required: false
        default: ''
      grep:
        description: 'Regex passed to --grep'
        required: false
        default: ''
      grep_invert:
        description: 'Regex passed to --grep-invert'
        required: false
        default: ''
      project:
        description: 'Playwright project name passed to --project'
        required: false
        default: ''
      ref:
        description: 'Git ref to check out and test'
        required: true
      testdino_run_id:
        description: 'Parent TestDino run id — results attach to it'
        required: false
        default: ''
      trigger_id:
        description: 'TestDino trigger id (audit correlation)'
        required: true
      dry_run:
        description: 'When "true" the job exits 0 immediately (setup validation)'
        required: false
        default: 'false'

jobs:
  testdino-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: TestDino dry-run short-circuit
        if: inputs.dry_run == 'true'
        run: echo "TestDino dry-run — workflow reachable, exiting 0."

      - name: Checkout
        if: inputs.dry_run != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        if: inputs.dry_run != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: inputs.dry_run != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: inputs.dry_run != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run scoped tests via TestDino
        if: inputs.dry_run != 'true'
        env:
          TESTDINO_RUN_ID: ${{ inputs.testdino_run_id }}
          TESTDINO_TRIGGER_ID: ${{ inputs.trigger_id }}
          # E2E branch uses a dedicated secret so the production TESTDINO_TOKEN
          # stays untouched. The generated file ships with secrets.TESTDINO_TOKEN.
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_E2E_TOKEN }}
          # Optional: point at a non-default TestDino server (self-hosted, staging).
          # Empty repo variable leaves the CLI on its built-in default.
          TESTDINO_SERVER_URL: ${{ vars.TESTDINO_SERVER_URL }}
          TD_GREP: ${{ inputs.grep }}
          TD_GREP_INVERT: ${{ inputs.grep_invert }}
          TD_PROJECT: ${{ inputs.project }}
          TD_TEST_LIST: ${{ inputs.test_list }}
        run: |
          set --
          if [ -n "$TD_GREP" ]; then set -- "$@" --grep "$TD_GREP"; fi
          if [ -n "$TD_GREP_INVERT" ]; then set -- "$@" --grep-invert "$TD_GREP_INVERT"; fi
          if [ -n "$TD_PROJECT" ]; then set -- "$@" --project "$TD_PROJECT"; fi
          if [ -n "$TD_TEST_LIST" ]; then
            while IFS= read -r location; do
              [ -n "$location" ] && set -- "$@" "$location"
            done <<< "$TD_TEST_LIST"
          fi
          echo "TestDino scoped args: $@"
          npx tdpw test "$@"
