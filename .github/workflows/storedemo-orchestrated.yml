# storedemo.testdino.com journeys, pipeline 3 of 3: TestDino orchestration.
#
#   2 machines × 2 workers each, same 20 spec files as the sharded pipeline.
#
# 1. discover  lists the suite once and mints an orchestration id. TestDino
#              orders the spec files by their p95 duration from past runs
#              (sequential and sharded runs count), longest first.
# 2. machine   both machines join the orchestration over a WebSocket and pull
#              batches of up to 2 specs (one per worker) until the queue
#              drains. The results merge into one TestDino run.
#
# Requires the orchestrator enabled on the TestDino server and
# @testdino/playwright 2.7.0 (vendored; installed only in this workflow).
#
# Trigger manually (Actions tab or `gh workflow run storedemo-orchestrated.yml`).
# The push trigger only registers the workflow from a non-default branch; its
# jobs are skipped on push.
#
# Re-runs: the TestDino re-run sheet dispatches this workflow with
# `testdino_rerun_from` set. Discover and the machines are skipped and one job
# runs the selected tests through `tdpw test --rerun`. A re-run is deliberately
# NOT orchestrated: `orchestrate discover` selects by --project/--grep over the
# whole testDir and has no rerun scope, and the re-run feature does not use the
# orchestrator at all.
#
# Secrets/variables:
#   secrets.STOREDEMO_TESTDINO_TOKEN   TestDino project API key
#   vars.TESTDINO_SERVER_URL           TestDino server URL

name: Storedemo 3 · Orchestrated

on:
  push:
    paths:
      - '.github/workflows/storedemo-orchestrated.yml'
  workflow_dispatch:
    # Declaring these is what makes the workflow selectable in the re-run sheet:
    # the dashboard hides any workflow without `testdino_rerun_from`, and GitHub
    # rejects a dispatch carrying an input the workflow does not declare.
    inputs:
      testdino_rerun_from:
        description: 'TestDino run id to re-run from (empty = normal orchestrated run)'
        required: false
        default: ''
      testdino_rerun_scope:
        description: 'failed | flaky | all'
        required: false
        default: 'failed'
      testdino_rerun_test_ids:
        description: 'Comma-separated test ids — exactly these (overrides scope)'
        required: false
        default: ''
      testdino_rerun_exclude_ids:
        description: 'Comma-separated test ids to drop from the scope'
        required: false
        default: ''
      testdino_rerun_sha:
        description: 'Commit to check out, for a same-commit re-run'
        required: false
        default: ''

env:
  TESTDINO_TOKEN: ${{ secrets.STOREDEMO_TESTDINO_TOKEN }}
  TESTDINO_SERVER_URL: ${{ vars.TESTDINO_SERVER_URL }}

jobs:
  discover:
    name: Discover and mint orchestration
    if: github.event_name == 'workflow_dispatch' && inputs.testdino_rerun_from == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      orchestration_id: ${{ steps.discover.outputs.orchestration_id }}

    steps:
      # workflow_dispatch resolves `ref` to the branch TIP, so a same-commit
      # re-run has to travel as an input and be checked out here. `github.sha`
      # keeps push and every other trigger on the ref the event already chose.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.testdino_rerun_sha || github.sha }}

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps + TestDino CLI 2.7.0
        run: |
          npm ci
          npm install --no-save ./vendor/testdino-playwright-2.7.0.tgz

      - name: Discover
        id: discover
        run: |
          npm run storedemo:orchestrate:discover
          id=$(node -p "require('./storedemo/.orchestration.json').orchestrationId")
          specs=$(node -p "require('./storedemo/.orchestration.json').specCount")
          echo "orchestration $id with $specs spec files"
          test "$specs" -gt 0
          echo "orchestration_id=$id" >> "$GITHUB_OUTPUT"

  # Skipped automatically on a re-run: `needs: discover` and discover is skipped.
  machine:
    name: Machine m${{ matrix.machine }} (2 workers)
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        machine: [1, 2]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.testdino_rerun_sha || github.sha }}

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps + TestDino CLI 2.7.0 + chromium
        run: |
          npm ci
          npm install --no-save ./vendor/testdino-playwright-2.7.0.tgz
          npx playwright install --with-deps chromium

      # Exits 0 when the orchestrator sends `end`, even if tests failed;
      # TestDino holds the real result.
      - name: Join orchestration and run assigned specs
        working-directory: storedemo
        run: >
          npx tdpw orchestrate run
          --orchestration-id "${{ needs.discover.outputs.orchestration_id }}"
          --device-id "m${{ matrix.machine }}"
          --workers=2

  rerun:
    name: Re-run selected tests (not orchestrated)
    if: github.event_name == 'workflow_dispatch' && inputs.testdino_rerun_from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.testdino_rerun_sha || github.sha }}

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `--rerun` needs CLI 2.7.0 — the pinned 2.3.1 fails with
      # `unknown option '--rerun'` — so the vendored tarball goes on top of
      # `npm ci`. It also needs Playwright 1.56+ (it drives --test-list, added
      # in 1.56); package.json now pins a newer Playwright, so npm ci covers it.
      - name: Install deps + TestDino CLI 2.7.0 + chromium
        run: |
          npm ci
          npm install --no-save ./vendor/testdino-playwright-2.7.0.tgz
          npx playwright install --with-deps chromium

      # No TESTDINO_CI_RUN_ID here: a re-run is its own TestDino run, not
      # another machine merged into the source run.
      - name: Re-run via tdpw
        working-directory: storedemo
        env:
          TD_FROM: ${{ inputs.testdino_rerun_from }}
          TD_SCOPE: ${{ inputs.testdino_rerun_scope }}
          TD_TEST_IDS: ${{ inputs.testdino_rerun_test_ids }}
          TD_EXCLUDE_IDS: ${{ inputs.testdino_rerun_exclude_ids }}
        run: |
          set -- --rerun "${TD_SCOPE:-failed}" --from-run "$TD_FROM"
          if [ -n "$TD_TEST_IDS" ]; then set -- "$@" --test-ids "$TD_TEST_IDS"; fi
          if [ -n "$TD_EXCLUDE_IDS" ]; then set -- "$@" --exclude-ids "$TD_EXCLUDE_IDS"; fi
          echo "tdpw test $*"
          npx tdpw test "$@"

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: storedemo-rerun-report
          path: storedemo/report
          retention-days: 7
