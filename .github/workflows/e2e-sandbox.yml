# Run Playwright tests for a pull request inside an E2B sandbox when someone
# comments on the PR. The sandbox posts the results back on the PR itself, so
# this job only starts the sandbox and exits (about 30 seconds of runner time).
#
# Usage: comment on a pull request
#   /e2e                               run everything
#   /e2e --grep "Sign Up"              only tests matching a title
#   /e2e tests/login.spec.js           one file
#   /e2e --project chromium --grep @smoke
# Everything after "/e2e" is passed to `npx playwright test` unchanged.
#
# Required repository secrets:
#   E2B_API_KEY        E2B project API key
#   RUNNER_SSH_KEY     private half of a read-only deploy key on prat3ik/e2b-playwright-runner
#                      (needed only while that repo is private)
#   GH_RESULTS_TOKEN   GitHub token that can write issues/PR comments on this repo; the sandbox
#                      uses it after this job has finished (the job's own token expires then)
#   TEST_ENV           the tests' .env file contents (USERNAME, PASSWORD, NEW_PASSWORD, S* shipping vars)
# Optional repository variables:
#   E2B_RUNNER_REPO    default prat3ik/e2b-playwright-runner
#   E2B_RUNNER_REF     default main
#   SANDBOX_TIMEOUT_MIN  hard cap on sandbox life, default 45

name: E2E in E2B sandbox

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  start:
    name: Start sandbox run
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/e2e')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Parse test arguments from the comment
        id: args
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          # First line only, drop the "/e2e" prefix, keep the rest verbatim.
          FIRST=$(printf '%s\n' "$COMMENT" | head -n1 | tr -d '\r')
          ARGS=${FIRST#/e2e}
          ARGS=$(printf '%s' "$ARGS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Playwright args: $ARGS"

      - name: Acknowledge the comment
        id: ack
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          ARGS: ${{ steps.args.outputs.args }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null
          BODY="⏳ Starting \`/e2e $ARGS\` in an E2B sandbox… results will appear here. [workflow run]($RUN_URL)"
          ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY" --jq .id)
          echo "comment_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Check out the E2B runner
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.E2B_RUNNER_REPO || 'prat3ik/e2b-playwright-runner' }}
          ref: ${{ vars.E2B_RUNNER_REF || 'main' }}
          ssh-key: ${{ secrets.RUNNER_SSH_KEY }}
          path: runner

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runner/package-lock.json

      - name: Install runner dependencies
        working-directory: runner
        run: npm ci --no-audit --no-fund

      - name: Start the sandbox and detach
        id: detach
        working-directory: runner
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          REPO_URL: ${{ github.event.repository.clone_url }}
          PW_ARGS: ${{ steps.args.outputs.args }}
          GH_TOKEN: ${{ secrets.GH_RESULTS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ACK_COMMENT_ID: ${{ steps.ack.outputs.comment_id }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          TEST_ENV: ${{ secrets.TEST_ENV }}
          SANDBOX_TIMEOUT_MIN: ${{ vars.SANDBOX_TIMEOUT_MIN || '45' }}
        run: npx tsx detach.ts 2>&1 | tee detach.log

      - name: Report a start failure on the pull request
        if: failure()
        env:
          ACK_ID: ${{ steps.ack.outputs.comment_id }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          {
            printf '### ❌ Could not start the E2B sandbox run\n\nSee the [workflow run](%s).\n' "$RUN_URL"
            if [ -s runner/detach.log ]; then printf '\n```\n'; tail -n 30 runner/detach.log; printf '```\n'; fi
          } > summary.md
          if [ -n "$ACK_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ACK_ID" -F body=@summary.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@summary.md >/dev/null
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=-1 >/dev/null
